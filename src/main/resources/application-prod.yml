server:
  port: 8080
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        generate_statistics: true
  flyway:
    enabled: true
    clean-disabled: true #clean 명령 금지
    validate-on-migrate: true

kakao:
  map:
    api:
      key: ${KAKAO_MAP_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: gmg
      environment: ${spring.profiles.active}
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      logback: true
      hikaricp: true
      hibernate: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests:
          - 0.5    # p50
          - 0.75   # p75
          - 0.95   # p95
          - 0.99   # p99
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    defaults:
      enabled: true
    db:
      enabled: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  config: classpath:logback/logback-prod.xml
  level:
    eusyaeusya.gmg: info

management-config:
  allowed-ip: ${ACTUATOR_ALLOWED_IP}