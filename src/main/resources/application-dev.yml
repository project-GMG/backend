server:
  port: 8080
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        generate_statistics: true
  flyway:
    enabled: true
    clean-disabled: true #clean 명령 금지
    validate-on-migrate: true

kakao:
  map:
    api:
      key: ${KAKAO_MAP_API_KEY}

google:
  maps:
    api:
      base-url: https://places.googleapis.com
      key: ${GOOGLE_MAPS_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: gmg
      environment: ${spring.profiles.active}
      enable:
        jvm: true
        process: true
        system: true
        tomcat: true
        logback: true
        hikaricp: true
        hibernate: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    defaults:
      enabled: true
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /api-docs

logging:
  config: classpath:logback/logback-dev.xml
  level:
    eusyaeusya.gmg: trace
    org.flywaydb: DEBUG

management-config:
  allowed-ip: ${ACTUATOR_ALLOWED_IP:127.0.0.1}