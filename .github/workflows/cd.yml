name: CD - Deploy to Dev

on:
  push:
    branches: [ dev ]

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY_NAME }}
  IMAGE_NAME: myapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_NAME }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure VM
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # ACR 로그인
            echo ${{ secrets.AZURE_REGISTRY_PASSWORD }} | docker login ${{ secrets.AZURE_REGISTRY_NAME }} -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin
            
            # 기존 컨테이너 중지 및 삭제
            docker stop myapp || true
            docker rm myapp || true
            
            # 최신 이미지 pull
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            
            # 새 컨테이너 실행
            docker run -d \
              --name myapp \
              -p 8080:8080 \
              --restart unless-stopped \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            
            # 이전 이미지 정리
            docker image prune -af
      - name: notify discord
        if: always()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "배포 결과는??"
          embed-description: |
            Envoironment: backend - ${{ matrix.environment }}
            Result : ${{ steps.deploy.outcome == 'success' && '😊 성공!!' || '🥲 실패!' }}
          embed-color: ${{ steps.deploy.outcome == 'success' && '3066993' || '15158332' }}